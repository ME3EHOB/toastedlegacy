<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toasted Legacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ТАЙМЕР -->
    <div id="timer-page">
        <div class="countdown">
            <div class="time-block"><span id="days">00</span><p>дней</p></div>
            <div class="time-block"><span id="hours">00</span><p>часов</p></div>
            <div class="time-block"><span id="minutes">00</span><p>минут</p></div>
            <div class="time-block"><span id="seconds">00</span><p>секунд</p></div>
        </div>
    </div>

    <!-- ОСНОВНОЙ САЙТ -->
    <div id="main-page">
        <button id="menu-button" onclick="toggleMenu()">•••</button>

        <div id="menu">
            <button onclick="showPage('home')">Главная</button>
            <button onclick="showPage('history')">История</button>
            <button onclick="showPage('archive')">Архив</button>
            <button onclick="showPage('theme')">Тематика</button>
            <button onclick="showPage('creators')">Создатели</button>
            <button onclick="closeSite()">R.</button>
            <button class="socials-btn" onclick="showPage('socials')">Соцсети</button>
        </div>

        <div id="home" class="page active">
            <div class="hero">
                <div id="bg-video"></div>
                <h1>Toasted Legacy</h1>
            </div>
            <div class="media-section">
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/gj0izUkZf-U?rel=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
                <div class="screenshots-row">
                    <img src="image1TL.jpg" alt="Скриншот 1">
                    <img src="image2TL.jpg" alt="Скриншот 2">
                    <img src="image3TL.jpg" alt="Скриншот 3">
                </div>
            </div>
            <div class="dots-section">• • •</div>
            <footer>@ME3EH</footer>
            <div id="video-date">--.--.--</div>
            <div id="online-counter"><span id="online-count">0</span> онлайн</div>
        </div>

        <div id="history" class="page">
            <div class="sub-page"><h2>История</h2><p>Скоро</p></div>
        </div>
        <div id="archive" class="page">
            <div class="sub-page"><h2>Архив</h2>
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/gj0izUkZf-U?rel=0&modestbranding=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                </div>
            </div>
        </div>
        <div id="theme" class="page">
            <div class="sub-page"><h2>Тематика</h2><p>Скоро</p></div>
        </div>
        <div id="creators" class="page">
            <div class="sub-page"><h2>Создатели</h2></div>
        </div>
        <div id="socials" class="page">
            <div class="sub-page"><h2>Соцсети</h2>
                <div class="socials-list">
                    <a href="https://youtube.com/@me3eh_gd" target="_blank">YouTube</a>
                    <a href="https://t.me/ME3EHOB" target="_blank">Telegram</a>
                    <a href="https://t.me/ToastGDTeam" target="_blank">Telegram команды</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
