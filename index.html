<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toasted Legacy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- РАБОЧИЙ СТОЛ -->
    <div id="desktop">
        
        <!-- ОБОИ (ВИДЕО) -->
        <div class="wallpaper">
            <video autoplay muted playsinline id="bg-video-local">
                <source src="media/video1TL.mp4" type="video/mp4">
            </video>
        </div>

        <!-- ИКОНКИ НА РАБОЧЕМ СТОЛЕ -->
        <div class="desktop-icons">
            <div class="icon" onclick="openFolder('infoFolder', 'Краткая информация')">
                <img src="https://img.icons8.com/color/96/folder-invoices--v1.png" alt="Папка" class="icon-img">
                <span>Краткая информация</span>
            </div>
        </div>

        <!-- ЦЕНТРАЛЬНАЯ НАДПИСЬ -->
        <div class="desktop-center">
            <h1>TOASTED LEGACY</h1>
            <div id="splash">--</div>
        </div>

        <!-- ОКНО ПАПКИ -->
        <div id="infoFolder" class="window hidden">
            <div class="window-header" id="infoFolderHeader">
                <div class="window-title">Краткая информация</div>
                <div class="window-controls">
                    <button onclick="minimizeWindow('infoFolder')">—</button>
                    <button onclick="toggleMaximize('infoFolder')">□</button>
                    <button class="close-btn" onclick="closeWindow('infoFolder')">✕</button>
                </div>
            </div>
            <div class="window-content">
                <!-- Тут будет текст, пока пусто -->
                <p style="color: #888; text-align: center; margin-top: 50px;">Папка пуста...</p>
            </div>
        </div>

    </div>

    <!-- ПАНЕЛЬ СНИЗУ (TASKBAR) -->
    <div id="taskbar">
        <div class="taskbar-left" id="taskbarApps">
            <!-- Сюда будут добавляться иконки открытых окон -->
        </div>
        <div class="taskbar-right">
            <div id="online-counter"><span id="online-count">0</span> онлайн</div>
        </div>
    </div>

    <!-- ПОДКЛЮЧЕНИЕ СКРИПТОВ -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
