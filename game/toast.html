<div id="toast-game-container">
    <div class="game-start" id="game-start">
        <p class="game-start-text">Лови тосты в корзину!</p>
        <p class="game-start-hint">Пропустишь 5 тостов — игра окончена</p>
        <button class="game-start-btn" onclick="startGame()">СТАРТ</button>
    </div>

    <div class="game-info" id="game-info" style="display:none;">
        <div>Очки: <span id="game-score">0</span></div>
        <div>Рекорд: <span id="game-record">0</span></div>
        <div>Промахи: <span id="game-misses">0</span>/5</div>
    </div>

    <div class="game-area" id="game-area" style="display:none;">
        <div class="player" id="player">🛒</div>
        <div class="game-over" id="game-over" style="display:none;">
            <div class="game-over-title">Игра окончена!</div>
            <div class="game-over-score">Очки: <span id="final-score">0</span></div>
            <div class="game-over-record" id="new-record" style="display:none;">🏆 Новый рекорд!</div>
            <div class="game-buttons">
                <button onclick="startGame()">Начать заново</button>
                <button onclick="closeWindow('toastGameWindow')">Выйти</button>
                <button onclick="shareRecord()">Поделиться</button>
            </div>
        </div>
    </div>
</div>
